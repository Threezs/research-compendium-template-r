name: targets-check

on:
  push:
    paths:
      - "_targets.R"
      - "R/**"
      - "data/mock/**"
      - "config/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::targets, any::tarchetypes, any::readr, any::dplyr, any::yaml
      - name: Run targets
        run: Rscript -e 'targets::tar_make()'
